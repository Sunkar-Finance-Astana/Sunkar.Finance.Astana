<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Стать агентом — Sunkar Finance</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script src="calc.js" defer></script>
</head>
<body>
  <div class="page small">
    <header class="topbar small">
      <div class="brand">
        <img src="img/logo.png" alt="" class="brand-logo">
        <div class="brand-text">
          <div class="company">Sunkar Finance</div>
          <div class="tag">Стать нашим агентом</div>
        </div>
      </div>
      <div class="top-controls">
        <a href="index.html" class="lang">RU</a>
        <a href="kz.html" class="lang">KZ</a>
      </div>
    </header>

    <main class="container">
      <h1>Стать нашим агентом</h1>
      <p class="lead">Оставьте заявку — мы свяжемся и подключим в сеть агентов.</p>

      <form id="agentForm" class="form-card">
        <label>ФИО <input name="name" placeholder="Иванов Иван" required></label>
        <label>Город <input name="city" placeholder="Астана" required></label>
        <label>Телефон <input name="phone" placeholder="+7 7xx xxx xx xx" required></label>

        <div class="form-actions">
          <button type="submit" class="btn btn-gold">Отправить заявку (WhatsApp)</button>
        </div>
      </form>

      <p class="note">Мы ответим в течение часа.</p>
    </main>
  </div>
</body>
</html>
