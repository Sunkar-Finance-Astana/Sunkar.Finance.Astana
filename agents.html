<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Станьте агентом — Sunkar Finance</title>
  <meta property="og:image" content="img/logo-preview.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="wrap">
      <a href="index.html" style="color:var(--gold)">Главная</a>
      <div class="lang-switch">
        <a href="agents.html" class="active">RU</a>
        <a href="agents-kz.html">KZ</a>
      </div>
    </div>
  </header>

  <main class="wrap" style="padding:80px 20px;text-align:center">
    <h2 style="font-size:3rem;color:var(--gold);margin-bottom:20px">
      Станьте нашим агентом
    </h2>
    <p style="font-size:1.6rem;max-width:700px;margin:0 auto 50px">
      Приводите клиентов — получайте <b>1–2% от суммы сделки</b> каждый месяц<br>
      Выплаты 2 раза в месяц · без ограничений по доходу
    </p>

    <div style="max-width:500px;margin:0 auto;display:grid;gap:22px">
      <input type="text" placeholder="Ваше ФИО *" required style="padding:20px;border-radius:16px;border:none;font-size:1.2rem">
      <input type="tel" placeholder="Телефон +7 ___ ___ __ __ *" required style="padding:20px;border-radius:16px;border:none;font-size:1.2rem">
      <input type="text" placeholder="Город (например: Алматы)" style="padding:20px;border-radius:16px;border:none;font-size:1.2rem">

      <button id="agentBtn" class="btn btn-gold large" style="padding:22px;font-size:1.4rem">
        Отправить заявку → WhatsApp
      </button>
    </div>

    <p style="margin-top:40px;color:#aaa;font-size:1.1rem">
      Мы свяжемся с вами в течение 5 минут
    </p>
  </main>

  <script>
    document.getElementById('agentBtn').onclick = () => {
      const fio = document.querySelectorAll('input[type=text]')[0].value.trim();
      const phone = document.querySelector('input[type=tel]').value.trim();
      const city = document.querySelectorAll('input[type=text]')[1].value.trim() || '—';
      const text = encodeURIComponent(`Хочу стать агентом Sunkar Finance!\nФИО: \( {fio}\nТелефон: \){phone}\nГород: \( {city}\n \){new Date().toLocaleString()}`);
      location.href = `https://wa.me/77052606667?text=${text}`;
    };
  </script>
</body>
</html>
