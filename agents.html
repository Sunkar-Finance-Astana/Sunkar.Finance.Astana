<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Стать агентом — Sunkar Finance</title>
  <link rel="icon" href="img/logo-preview.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="site">
    <header class="site-header minimal">
      <a class="back" href="index.html">← Главная</a>
    </header>

    <section class="section container">
      <h1>Станьте нашим агентом — заработок от 1% комиссии</h1>
      <p>Присоединяйтесь к сети агентов Sunkar Finance: приводите клиентов — получаете комиссию от каждой закрытой сделки. Мы даём маркетинговые материалы и техподдержку.</p>

      <form id="agent-form" class="agent-form">
        <div class="row"><label>ФИО</label><input name="name" required /></div>
        <div class="row"><label>Город</label><input name="city" required /></div>
        <div class="row"><label>Телефон</label><input name="phone" required placeholder="+7 ..." /></div>
        <div class="row"><label>Комментарий</label><input name="note" /></div>
        <div class="row"><button class="btn primary">Зарегистрироваться агентом</button></div>
      </form>

      <div id="agent-result" style="display:none" class="result"></div>

    </section>

    <footer class="site-footer small">
      <div class="container">© Sunkar Finance — Астана, ул. Абая 18</div>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
