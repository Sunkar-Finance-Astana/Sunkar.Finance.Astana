<!-- agents.html -->
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Станьте агентом — Sunkar Finance</title>
  <meta property="og:image" content="img/logo-preview.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header small">
    <div class="wrap"><a href="index.html" class="back-link">← Главная</a></div>
  </header>
  <main class="wrap">
    <h2>Станьте нашим агентом</h2>
    <p class="lead">Приводите клиентов — получайте 1–2% от суммы сделки</p>
    <form id="agentForm">
      <input type="text" placeholder="ФИО" required>
      <input type="tel" placeholder="Телефон" required>
      <input type="text" placeholder="Город">
      <button class="btn btn-gold">Отправить заявку</button>
    </form>
  </main>
  <script>
    document.getElementById('agentForm').onsubmit = e => {
      e.preventDefault();
      const phone = e.target.querySelector('input[type=tel]').value;
      location.href = `https://wa.me/77052606667?text=Хочу%20стать%20агентом%20Sunkar%20Finance!%20\( {encodeURIComponent(e.target.querySelector('input[type=text]').value)}%20 \){phone}`;
    };
  </script>
</body>
</html>
