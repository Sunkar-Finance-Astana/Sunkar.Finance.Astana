<!-- approval.html -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Узнать вероятность одобрения — Sunkar Finance</title>
<meta property="og:image" content="img/logo.png">
<style>
:root{--bg:#041018;--gold:#D4A24A;--muted:rgba(255,255,255,0.78)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,#031017,#041018);color:#fff}
.container{max-width:820px;margin:18px auto;padding:16px}
.header{display:flex;gap:12px;align-items:center}
.logo-wrap{width:56px;height:56px;border-radius:12px;background:#081d26;display:flex;align-items:center;justify-content:center}
.logo-wrap img{width:70%}
.card{background:linear-gradient(180deg,rgba(255,255,255,0.01),transparent);padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);margin-top:12px}
label{display:block;margin-top:10px;color:var(--muted)}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:#fff}
.btn{margin-top:12px;padding:10px 14px;border-radius:10px;background:linear-gradient(90deg,var(--gold),#c38f3a);color:#07121B;font-weight:700;border:0;cursor:pointer}
.result{margin-top:12px;padding:12px;border-radius:10px;background:rgba(255,255,255,0.02);color:var(--muted)}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo-wrap"><img src="img/logo.png" alt="logo"></div>
    <div>
      <h1 style="margin:0;color:var(--gold)">Калькулятор вероятности одобрения</h1>
      <div style="color:var(--muted)">Заполните форму — мы сразу увидим примерный шанс одобрения.</div>
    </div>
  </div>

  <div class="card">
    <form id="calcForm" onsubmit="event.preventDefault();calculate();">
      <label>ФИО *</label><input id="fio" required type="text" placeholder="Иванов Иван">
      <label>Телефон *</label><input id="phone" required type="tel" placeholder="+7 7xx xxx xx xx">
      <label>Город *</label><input id="city" required type="text" value="Астана">
      <label>Услуга *</label>
      <select id="serviceType" onchange="onServiceChange()">
        <option value="">Выберите</option>
        <option value="unsecured_no_income">Кредит без залога (до 10 млн)</option>
        <option value="unsecured_with_income">Кредит без залога (до 20 млн)</option>
        <option value="secured">Кредит под залог</option>
        <option value="mortgage">Ипотека</option>
        <option value="business">Для ИП/ТОО</option>
        <option value="auto">Автокредит</option>
        <option value="refinance">Рефинансирование</option>
      </select>

      <div id="mortgageOptions" style="display:none">
        <label>Ипотека — первичный / вторичный</label>
        <select id="mortgageType"><option value="primary">Первичное жильё</option><option value="secondary">Вторичное жильё</option></select>
        <label>Первоначальный взнос (₸)</label><input id="deposit" type="number" value="0">
      </div>

      <label>Желаемая сумма (₸)</label><input id="amount" type="number" value="5000000">
      <label>Официальный доход в мес. (₸)</label><input id="income" type="number" value="200000">
      <label>Ежемесячные текущие платежи (₸)</label><input id="payments" type="number" value="0">
      <label>Есть активные просрочки?</label>
      <select id="currentLate"><option value="no">Нет</option><option value="yes">Да</option></select>
      <label>Были просрочки ранее?</label>
      <select id="pastLate"><option value="no">Нет</option><option value="minor">Мелкие до 30 дней</option><option value="major">Серьёзные (30+)</option></select>

      <button class="btn" type="submit">Рассчитать</button>
      <button class="btn" type="button" style="background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,0.04);margin-left:8px" onclick="resetForm()">Сбросить</button>
    </form>

    <div id="result" class="result" style="display:none">
      <div style="font-size:32px;color:var(--gold);font-weight:800" id="percent">0%</div>
      <div id="resultText" style="margin-top:8px;color:var(--muted)"></div>
      <div style="margin-top:10px">
        <a id="waSend" class="btn" href="#" target="_blank">Отправить заявку в WhatsApp</a>
      </div>
    </div>
  </div>

  <footer style="margin-top:12px;color:var(--muted)">© Sunkar Finance — WhatsApp: <a href="https://wa.me/77052606667" style="color:var(--muted)">+7 705 260 6667</a></footer>
</div>

<script>
function onServiceChange(){
  const s = document.getElementById('serviceType').value;
  document.getElementById('mortgageOptions').style.display = s==='mortgage' ? 'block' : 'none';
}
function resetForm(){
  document.getElementById('calcForm').reset();
  document.getElementById('mortgageOptions').style.display='none';
  document.getElementById('result').style.display='none';
}

function calculate(){
  const service = document.getElementById('serviceType').value;
  const amount = Number(document.getElementById('amount').value) || 0;
  const income = Number(document.getElementById('income').value) || 0;
  const payments = Number(document.getElementById('payments').value) || 0;
  const currentLate = document.getElementById('currentLate').value;
  const pastLate = document.getElementById('pastLate').value;
  const mortgageType = document.getElementById('mortgageType') ? document.getElementById('mortgageType').value : 'primary';
  const deposit = Number(document.getElementById('deposit').value) || 0;

  let score = 50;
  let years = 5;
  if(service === 'mortgage') years = 20;
  if(service === 'auto') years = 5;
  if(service === 'business') years = 3;
  if(service === 'refinance') years = 5;
  const monthlyEstimate = (amount / (years*12)) * 1.02;

  if(income <= 0){ score -= 25; } else {
    const ratio = monthlyEstimate / income;
    if(ratio < 0.2) score += 18;
    else if(ratio < 0.35) score += 8;
    else if(ratio < 0.5) score += 0;
    else score -= 10 + Math.min(20, (ratio-0.5)*60);
  }

  if(income > 0){
    const debtLoad = payments / income;
    if(debtLoad < 0.2) score += 8;
    else if(debtLoad < 0.35) score += 0;
    else score -= Math.round((debtLoad-0.35)*100);
  }

  const serviceWeights = {
    'unsecured_no_income': -8,
    'unsecured_with_income': 4,
    'secured': 6,
    'mortgage': 2,
    'business': -2,
    'auto': 2,
    'refinance': 6,
    '': 0
  };
  score += (serviceWeights[service] || 0);

  if(currentLate === 'yes') score -= 28;
  if(pastLate === 'minor') score -= 8;
  if(pastLate === 'major') score -= 18;

  if(service === 'mortgage'){
    const depRatio = deposit / Math.max(1, amount);
    if(depRatio >= 0.2) score += 10;
    else if(depRatio >= 0.1) score += 4;
    else score -= 4;
    if(mortgageType === 'primary') score += 4;
  }

  if(service === 'business' && amount > 50000000) score -= 6;
  if(amount > income * 60) score -= 8;

  const percent = Math.round(Math.max(3, Math.min(98, score)));
  let msg = '';
  if(percent >= 80) msg = 'Очень высокая вероятность одобрения. Рекомендуем отправить заявку — шансы отличные.';
  else if(percent >= 60) msg = 'Хорошая вероятность. Возможны небольшие условия по сумме или срокам.';
  else if(percent >= 40) msg = 'Средняя вероятность — потребуется дополнительный пакет документов или поручители.';
  else msg = 'Низкая вероятность. Рекомендуем улучшить параметры (увеличить доход/первоначальный взнос или снизить сумму).';

  document.getElementById('percent').innerText = percent + '%';
  document.getElementById('resultText').innerText = msg;
  document.getElementById('result').style.display = 'block';

  const fio = encodeURIComponent(document.getElementById('fio').value || 'Клиент');
  const phone = encodeURIComponent(document.getElementById('phone').value || '');
  const city = encodeURIComponent(document.getElementById('city').value || '');
  const serviceLabel = encodeURIComponent((document.getElementById('serviceType').selectedOptions[0] || {text:''}).text);
  const preText = `Заявка%20Sunkar%20Finance%0A%0AИмя:%20${fio}%0AТелефон:%20${phone}%0AГород:%20${city}%0AУслуга:%20${serviceLabel}%0AСумма:%20${amount}%20₸%0AВероятность:%20${percent}%25%0AКомментарий:%20`;
  const waLink = `https://wa.me/77052606667?text=${preText}`;
  document.getElementById('waSend').href = waLink;
}
</script>
</body>
</html>
