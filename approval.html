<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Узнайте вероятность одобрения — Sunkar Finance</title>
  <meta name="description" content="Калькулятор вероятности одобрения от Sunkar Finance — заполните форму и отправьте заявку в WhatsApp.">
  <meta property="og:image" content="img/logo.png">
  <style>
    :root{--bg:#04121a;--gold:#D4A24A;--muted:rgba(255,255,255,0.78)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Roboto;background:linear-gradient(180deg,var(--bg),#021016);color:#fff}
    .wrap{max-width:980px;margin:18px auto;padding:16px}
    h1{color:var(--gold)}
    .card{background:rgba(255,255,255,0.02);padding:14px;border-radius:12px}
    label{display:block;color:var(--muted);margin-bottom:6px}
    input,select{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:#fff;margin-bottom:10px}
    .grid{display:grid;grid-template-columns:1fr 300px;gap:12px}
    .btn{padding:10px 14px;border-radius:10px;border:0;cursor:pointer;font-weight:700}
    .btn.primary{background:linear-gradient(90deg,var(--gold),#c78e2f);color:#07121B}
    .result{background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);padding:12px;border-radius:10px;text-align:center}
    .percent{font-size:42px;color:var(--gold);font-weight:800}
    @media(max-width:900px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Калькулятор вероятности одобрения</h1>
    <p style="color:var(--muted)">Заполните форму — мы посчитаем ориентировочную вероятность и вы сможете отправить заявку напрямую в WhatsApp.</p>

    <div class="card">
      <div class="grid">
        <div>
          <label>ФИО *</label>
          <input id="fio" type="text" placeholder="Иванов Иван">

          <label>Телефон (WhatsApp) *</label>
          <input id="phone" type="tel" placeholder="+7 7xx xxx xxxx">

          <label>Город *</label>
          <input id="city" type="text" value="Астана">

          <label>Вид услуги *</label>
          <select id="service">
            <option value="">Выберите</option>
            <option value="unsecured_no_income">Кредит без залога (до 10 млн)</option>
            <option value="unsecured_with_income">Кредит без залога (до 20 млн)</option>
            <option value="secured">Кредит под залог</option>
            <option value="mortgage">Ипотека</option>
            <option value="business">Для ИП/ТОО</option>
            <option value="auto">Автокредит</option>
            <option value="refinance">Рефинансирование</option>
          </select>

          <div id="mortgageBlock" style="display:none">
            <label>Ипотека — первичное / вторичное</label>
            <select id="mortType"><option value="primary">Первичное</option><option value="secondary">Вторичное</option></select>
            <label>Первоначальный взнос (₸)</label>
            <input id="deposit" type="number" value="0">
          </div>

          <label>Желаемая сумма (₸)</label>
          <input id="amount" type="number" value="5000000">

          <label>Официальный доход (₸)</label>
          <input id="income" type="number" value="200000">

          <label>Ежемесячные текущие платежи (₸)</label>
          <input id="payments" type="number" value="0">

          <label>Текущие просрочки</label>
          <select id="currentLate"><option value="no">Нет</option><option value="yes">Да</option></select>

          <label>Были просрочки ранее</label>
          <select id="pastLate"><option value="no">Нет</option><option value="minor">Мелкие (до 30 дней)</option><option value="major">Серьёзные (30+)</option></select>

          <div style="display:flex;gap:10px;margin-top:8px">
            <button class="btn primary" id="calcBtn">Рассчитать</button>
            <button class="btn" id="clearBtn" style="background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)">Сбросить</button>
          </div>
        </div>

        <div>
          <div id="resultBox" class="result" style="display:none">
            <div class="percent" id="percentVal">0%</div>
            <p id="resultText" style="color:var(--muted)"></p>
            <div style="display:flex;gap:8px;justify-content:center;margin-top:10px">
              <a id="sendWA" class="btn primary" href="#" target="_blank">Отправить заявку в WhatsApp</a>
              <button class="btn" onclick="document.getElementById('resultBox').style.display='none'">Закрыть</button>
            </div>
          </div>

          <div style="color:var(--muted);margin-top:12px;font-size:13px">
            Формула — ориентировочная: учитываем доход, долговую нагрузку, историю просрочек и тип услуги.
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  const WA = "https://wa.me/77756401892?text=";
  const serviceSelect = document.getElementById('service');
  serviceSelect.onchange = function(){
    document.getElementById('mortgageBlock').style.display = this.value === 'mortgage' ? 'block' : 'none';
  };

  document.getElementById('calcBtn').onclick = function(){
    // read
    const amount = Number(document.getElementById('amount').value)||0;
    const income = Number(document.getElementById('income').value)||0;
    const payments = Number(document.getElementById('payments').value)||0;
    const service = document.getElementById('service').value;
    const currentLate = document.getElementById('currentLate').value;
    const pastLate = document.getElementById('pastLate').value;
    const deposit = Number(document.getElementById('deposit').value)||0;
    // base
    let score = 50;
    // approximate monthly
    let years = 5;
    if(service === 'mortgage') years = 20;
    if(service === 'auto') years = 5;
    if(service === 'business') years = 3;
    const monthlyEstimate = (amount/(years*12))*1.02;
    if(income <= 0) score -= 25;
    else {
      const ratio = monthlyEstimate / income;
      if(ratio < 0.2) score += 18;
      else if(ratio < 0.35) score += 8;
      else if(ratio < 0.5) score += 0;
      else score -= 10 + Math.min(20,(ratio-0.5)*60);
    }
    if(income > 0){
      const debtLoad = payments / income;
      if(debtLoad < 0.2) score += 8;
      else if(debtLoad < 0.35) score += 0;
      else score -= Math.round((debtLoad-0.35)*100);
    }
    const serviceWeights = {'unsecured_no_income':-8,'unsecured_with_income':4,'secured':6,'mortgage':2,'business':-2,'auto':2,'refinance':6,'':0};
    score += (serviceWeights[service]||0);
    if(currentLate === 'yes') score -= 28;
    if(pastLate === 'minor') score -= 8;
    if(pastLate === 'major') score -= 18;
    if(service === 'mortgage'){
      const depRatio = amount ? deposit/amount : 0;
      if(depRatio >= 0.2) score += 10;
      else if(depRatio >= 0.1) score += 4;
      else score -= 4;
    }
    if(service === 'business' && amount > 50000000) score -= 6;
    if(amount > income*60) score -= 8;
    let percent = Math.round(Math.max(3, Math.min(98, score)));
    let msg = '';
    if(percent >= 80) msg = 'Очень высокая вероятность одобрения. Рекомендуем отправить заявку — шансы отличные.';
    else if(percent >= 60) msg = 'Хорошая вероятность. Возможны небольшие условия по сумме или срокам.';
    else if(percent >= 40) msg = 'Средняя вероятность — потребуется дополнительный пакет документов или поручители.';
    else msg = 'Низкая вероятность. Рекомендуем улучшить параметры (увеличить доход/взнос или снизить сумму).';
    document.getElementById('percentVal').innerText = percent + '%';
    document.getElementById('resultText').innerText = msg;
    document.getElementById('resultBox').style.display = 'block';

    // prepare WA link
    const fio = encodeURIComponent(document.getElementById('fio').value || 'Клиент');
    const phone = encodeURIComponent(document.getElementById('phone').value || '');
    const city = encodeURIComponent(document.getElementById('city').value || '');
    const serviceLabel = encodeURIComponent((serviceSelect.selectedOptions[0] || {text:''}).text);
    const pre = `Заявка%20Sunkar%20Finance%0A%0AИмя:%20${fio}%0AТелефон:%20${phone}%0AГород:%20${city}%0AУслуга:%20${serviceLabel}%0AСумма:%20${amount}%20₸%0AВероятность:%20${percent}%25%0AКомментарий:%20`;
    document.getElementById('sendWA').href = WA + pre;
  };

  document.getElementById('clearBtn').onclick = function(){
    document.getElementById('fio').value='';document.getElementById('phone').value='';document.getElementById('city').value='Астана';document.getElementById('amount').value=5000000;document.getElementById('income').value=200000;document.getElementById('payments').value=0;document.getElementById('deposit').value=0;document.getElementById('resultBox').style.display='none';
  };

</script>
</body>
</html>
