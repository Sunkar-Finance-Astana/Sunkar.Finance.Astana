<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Қабылдау ықтималдығын анықтау — Sunkar Finance</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="img/logo.png" />
</head>
<body>
  <div class="wrap">
    <a href="kz.html" style="color:#9fb0b2;text-decoration:underline">← Басты бетке оралу</a>

    <div class="card">
      <h2 style="color:var(--accent)">Қабылдау ықтималдығын анықтау</h2>
      <p class="muted">Форманы толтырыңыз — біз сізге ықтималдық пен кеңестер береміз.</p>

      <div style="margin-top:12px">
        <label>Тегі, аты *</label>
        <input id="fio" type="text" placeholder="Тегі Аты"/>
        <label style="margin-top:8px">Телефон *</label>
        <input id="phone" type="text" placeholder="+7 7xx xxx xx xx"/>
        <label style="margin-top:8px">Қала *</label>
        <input id="city" type="text" value="Астана"/>
        <label style="margin-top:8px">Қызмет *</label>
        <select id="service">
          <option value="">Таңдаңыз</option>
          <option value="consumer">Тұтынушылық</option>
          <option value="mortgage_primary">Ипотека — бастапқы</option>
          <option value="mortgage_secondary">Ипотека — екінші</option>
          <option value="collateral_real">Кепілге алынатын (мүлік)</option>
          <option value="collateral_auto">Кепілге алынатын (авто)</option>
          <option value="auto">Авто</option>
          <option value="refinance">Қайта қаржыландыру</option>
          <option value="biz">ШО/ТОО</option>
        </select>

        <label style="margin-top:8px">Қалаған сома (₸)</label>
        <input id="sum" type="number" value="5000000" />
        <label style="margin-top:8px">Айлық ресми табыс (₸)</label>
        <input id="income" type="number" value="200000" />
        <label style="margin-top:8px">Айлық ағымдағы төлемдер (₸)</label>
        <input id="payments" type="number" value="0" />
        <label style="margin-top:8px">Соңғы 90 күндегі кешікпелер</label>
        <select id="delay">
          <option value="none">Жоқ</option>
          <option value="30">1–30 күн</option>
          <option value="90">31–90 күн</option>
          <option value="90plus">90+ күн</option>
        </select>
        <label style="margin-top:8px">Ағымдағы несие саны</label>
        <input id="countCredits" type="number" value="0" />
        <label style="margin-top:8px">Жұмыс орны стажы (ай)</label>
        <input id="workMonths" type="number" value="24" />

        <div style="display:flex;gap:12px;margin-top:12px">
          <button id="calcBtn" class="btn primary">Есептеу</button>
          <button id="sendBtn" class="btn ghost">WhatsApp арқылы жіберу</button>
        </div>

        <div id="resultBox" class="result" style="display:none;margin-top:12px"></div>
      </div>
    </div>
  </div>

  <script src="calc.js"></script>
  <script>
    document.getElementById('calcBtn').addEventListener('click', ()=>{
      const data = {
        sum: document.getElementById('sum').value,
        income: document.getElementById('income').value,
        payments: document.getElementById('payments').value,
        delay: document.getElementById('delay').value,
        countCredits: document.getElementById('countCredits').value,
        workMonths: document.getElementById('workMonths').value,
        service: document.getElementById('service').value
      };
      const res = window.computeScore(data);
      const box = document.getElementById('resultBox');
      box.style.display = 'block';
      let level = 'Төмен';
      if(res.score >= 75) level = 'Жоғары';
      else if(res.score >= 50) level = 'Орташа';
      box.innerHTML = `<div style="font-weight:700;font-size:18px;color:${res.score>=75? '#9fe0a0':(res.score>=50? '#ffd480':'#f08a8a')}">${res.score}% — ${level} мақұлдау ықтималдығы</div>
        <div class="muted" style="margin-top:8px">Ұсыныс: ай сайынғы болжамды төлем — <b>${res.estimatedPayment} ₸</b>. Табысқа жүктеме — <b>${res.ratio}%</b>.</div>`;
    });

    document.getElementById('sendBtn').addEventListener('click', ()=>{
      const fio = encodeURIComponent(document.getElementById('fio').value || '—');
      const phone = encodeURIComponent(document.getElementById('phone').value || '—');
      const city = encodeURIComponent(document.getElementById('city').value || '—');
      const service = encodeURIComponent(document.getElementById('service').value || '—');
      const sum = encodeURIComponent(document.getElementById('sum').value || '—');
      const income = encodeURIComponent(document.getElementById('income').value || '—');
      const payments = encodeURIComponent(document.getElementById('payments').value || '—');
      const delay = encodeURIComponent(document.getElementById('delay').value || '—');

      const text = `Қабылдау%20ықтималдығы%20өтінімі%0AАты-жөні:%20${fio}%0AТел:%20${phone}%0AҚала:%20${city}%0AҚызмет:%20${service}%0AСома:%20${sum}%0AТабыс:%20${income}%0AТөлемдер:%20${payments}%0AКешіктіру:%20${delay}`;
      const wa = '77052606667';
      window.open(`https://wa.me/${wa}?text=${text}`, '_blank');
    });
  </script>
</body>
</html>
