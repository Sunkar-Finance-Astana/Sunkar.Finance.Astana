<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Узнайте вероятность одобрения — Sunkar Finance</title>
  <link rel="icon" href="img/logo-preview.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/calc.css" />
</head>
<body>
  <header class="site-header small">
    <div class="container header-inner">
      <a href="index.html" class="brand small">
        <img src="img/logo.png" alt="Sunkar Finance" class="logo" />
        <div class="brand-text"><div class="brand-name">Sunkar Finance</div></div>
      </a>
      <nav class="top-actions">
        <a href="index.html">Главная</a>
        <a href="agents.html">Агенты</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Узнайте вероятность одобрения</h1>
    <p>Заполните форму — мы сразу покажем примерный шанс одобрения и рекомендации.</p>

    <form id="prob-form" class="calc-form">
      <label>ФИО *</label>
      <input type="text" id="name" placeholder="Иванов Иван" required />

      <label>Телефон *</label>
      <input type="tel" id="phone" placeholder="+7 7хх ххх хх хх" required />

      <label>Город *</label>
      <input type="text" id="city" value="Астана" required />

      <label>Услуга *</label>
      <select id="service">
        <option value="">Выберите</option>
        <option value="consumer">Потребительский</option>
        <option value="mortgage">Ипотека</option>
        <option value="refinance">Рефинансирование</option>
        <option value="business">Кредиты для ИП/ТОО</option>
        <option value="auto">Авто</option>
      </select>

      <label>Желаемая сумма (₸)</label>
      <input type="number" id="amount" value="5000000" min="0" />

      <label>Официальный доход в мес. (₸)</label>
      <input type="number" id="income" value="200000" min="0" />

      <label>Ежемесячные текущие платежи (₸)</label>
      <input type="number" id="currentPayments" value="0" min="0" />

      <label>Есть активные просрочки?</label>
      <select id="delays">
        <option value="no">Нет</option>
        <option value="small">Просрочки до 90 дней</option>
        <option value="large">Просрочки более 90 дней</option>
      </select>

      <label>Кепіл (залог) есть?</label>
      <select id="collateral">
        <option value="no">Нет</option>
        <option value="realty">Недвижимость</option>
        <option value="auto">Авто</option>
      </select>

      <!-- Mortgage-specific mini-block -->
      <div id="mortgage-extra" class="hidden">
        <label>Ипотека — первичный или вторичный рынок?</label>
        <select id="mortgage-type">
          <option value="primary">Первичный</option>
          <option value="secondary">Вторичный</option>
        </select>

        <label>Первоначальный взнос (%)</label>
        <input type="number" id="downpayment" value="20" min="0" max="100" />
      </div>

      <button type="submit" class="btn btn-gold">Посчитать вероятность</button>
    </form>

    <div id="prob-result" class="result hidden">
      <h3>Результат</h3>
      <div id="score">—</div>
      <div id="advice"></div>
    </div>
  </main>

  <script src="js/script.js"></script>
  <script src="js/probability.js"></script>
</body>
</html>
