<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Ықтималдықты біліңіз — Sunkar Finance</title>
  <meta property="og:title" content="Ықтималдықты біліңіз — Sunkar Finance">
  <meta property="og:image" content="img/logo-preview.png">
  <link rel="icon" href="img/logo-preview.png" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/calc.css">
</head>
<body>
  <header class="header small">
    <div class="wrap">
      <a href="kz.html" class="back-link">← Басты бет</a>
      <div class="lang-switch">
        <a href="probability.html" class="lang-btn">RU</a>
        <a href="probability-kz.html" class="lang-btn active">KZ</a>
      </div>
    </div>
  </header>

  <main class="wrap calc-main">
    <section class="calc-intro">
      <h2>Несие алу ықтималдығын біліңіз</h2>
      <p>Форманы толтырыңыз — бірнеше секундта рейтинг (0–100%) алыңыз.</p>
    </section>

    <section class="calc-panel">
      <form id="probForm" class="calc-form" onsubmit="return false;">
        <div class="row"><label>Аты-жөні *</label><input type="text" id="fio" required></div>
        <div class="row two-cols">
          <div><label>Телефон *</label><input type="tel" id="phone" placeholder="+7 7xx xxx xx xx" required></div>
          <div><label>Қала *</label><input type="text" id="city" value="Астана" required></div>
        </div>
        <div class="row">
          <label>Қызмет түрі *</label>
          <select id="service" required>
            <option value="">Таңдаңыз</option>
            <option value="unsecured_no_income">Кепілсіз несие (10 млн дейін)</option>
            <option value="unsecured_with_income">Кепілсіз несие (20 млн дейін)</option>
            <option value="secured">Кепілмен несие</option>
            <option value="mortgage">Ипотека</option>
            <option value="business">ИП/ТОО несиесі</option>
            <option value="auto">Автонесие</option>
            <option value="refinance">Қайта қаржыландыру</option>
          </select>
        </div>
        <div id="mortgageBlock" style="display:none;">
          <div class="row"><label>Ипотека — бастапқы/екінші</label>
            <select id="mortgageType"><option value="primary">Бастапқы</option><option value="secondary">Екінші</option></select>
          </div>
          <div class="row"><label>Алғашқы жарна (₸)</label><input type="number" id="deposit" value="0"></div>
        </div>
        <div class="row"><label>Қажет сома (₸)</label><input type="number" id="amount" value="5000000"></div>
        <div class="row two-cols">
          <div><label>Ресми табыс (₸/ай)</label><input type="number" id="income" value="200000"></div>
          <div><label>Ай сайынғы төлемдер (₸)</label><input type="number" id="payments" value="0"></div>
        </div>
        <div class="row two-cols">
          <div><label>Ағымдағы кешігулер</label>
            <select id="currentLate"><option value="no">Жоқ</option><option value="closed">Жабылған</option><option value="30">30 күнге дейін</option><option value="90">30+ күн</option></select>
          </div>
          <div><label>Бұрын кешігу болды ма</label>
            <select id="pastLate"><option value="no">Жоқ</option><option value="90">90 күнге дейін</option><option value="more">90+ күн</option></select>
          </div>
        </div>
        <div class="row"><label>Салық/ломбард қарызы</label>
          <select id="taxDebt"><option value="no">Жоқ</option><option value="yes">Иә</option></select>
        </div>
        <div class="row actions">
          <button class="btn btn-primary" id="calcBtn">Есептеу</button>
          <button class="btn btn-outline" id="resetBtn" type="button">Тазалау</button>
        </div>
      </form>

      <div id="resultCard" class="result-card" style="display:none;">
        <div class="result-percent" id="resultPercent">0%</div>
        <div class="result-text" id="resultText"></div>
        <a id="toWhatsBtn" class="btn btn-primary" target="_blank">WhatsApp-қа өтініш жіберу</a>
      </div>
    </section>
  </main>

  <footer class="footer wrap">
    <div>© Sunkar Finance — Астана, Абай 18 — WhatsApp: <a href="https://wa.me/77052606667" class="gold-link">+7 705 260 66 67</a></div>
  </footer>

  <script src="js/probability.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
