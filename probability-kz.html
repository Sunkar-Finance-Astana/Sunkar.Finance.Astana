<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бекіту ықтималдығын 10 секундта біліңіз — Sunkar Finance</title>
  
  <meta property="og:title" content="Бекіту ықтималдығын 10 секундта біліңіз">
  <meta property="og:description" content="Форманы толтырыңыз — нақты пайызды бірден алыңыз">
  <meta property="og:image" content="https://sunkar-astana.github.io/img/logo-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="wrap">
      <div class="logo-block">
        <img src="img/logo.png" alt="">
        <div>
          <h1>Sunkar Finance</h1>
          <div class="tagline">Қазақстандағы №1 қаржылық консалтинг</div>
        </div>
      </div>
      <div class="lang-switch">
        <a href="probability.html">RU</a>
        <a href="probability-kz.html" class="active">KZ</a>
      </div>
    </div>
  </header>

  <main class="wrap" style="padding:80px 20px">
    <h2 style="text-align:center;font-size:3rem;color:var(--gold);margin-bottom:20px">
      Бекіту ықтималдығын біліңіз
    </h2>
    <p style="text-align:center;font-size:1.6rem;margin-bottom:50px">
      Форманы толтырыңыз — 10 секундта нақты рейтинг (0–100%) алыңыз
    </p>

    <div style="max-width:560px;margin:0 auto">
      <form id="calcForm" style="display:grid;gap:20px">
        <input type="text" placeholder="Аты-жөніңіз *" required>
        <input type="tel" placeholder="Телефон +7 7xx xxx xx xx *" required>
        <input type="text" placeholder="Қала (мысалы: Астана)" value="Астана" required>

        <select required>
          <option value="" disabled selected>Қызмет түрі *</option>
          <option>Кепілсіз несие (20 млн дейін)</option>
          <option>Кепілмен несие</option>
          <option>Ипотека</option>
          <option>Автонесие</option>
          <option>Бизнес несиесі</option>
          <option>Қайта қаржыландыру</option>
        </select>

        <input type="number" placeholder="Қажет сома (₸)" value="5000000">
        <input type="number" placeholder="Ресми табыс (₸/ай)" value="200000">
        <input type="number" placeholder="Ай сайынғы төлемдер (₸)" value="0">

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px">
          <select><option value="">Ағымдағы кешігулер</option><option>Жоқ</option><option>30 күнге дейін</option><option>30+ күн</option></select>
          <select><option value="">Бұрын кешігу болған ба</option><option>Жоқ</option><option>90 күнге дейін</option><option>90+ күн</option></select>
        </div>

        <select><option value="">Салық/ломбард қарызы</option><option>Жоқ</option><option>Иә</option></select>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px">
          <button type="button" id="calcBtn" class="btn btn-blue large">Есептеу</button>
          <button type="reset" class="btn" style="background:#333;color:#fff">Тазалау</button>
        </div>
      </form>

      <div id="result" style="display:none;margin-top:50px;text-align:center">
        <div style="font-size:5rem;font-weight:800;color:var(--gold)" id="percent">92%</div>
        <p style="font-size:1.6rem;margin:20px 0" id="text">Жоғары ықтималдық!</p>
        <a href="#" id="whatsappLink" class="btn btn-gold large">WhatsApp-қа өтініш жіберу</a>
      </div>
    </div>
  </main>

  <script src="js/probability.js"></script>
</body>
</html>
