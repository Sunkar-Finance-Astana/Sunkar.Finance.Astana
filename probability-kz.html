<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ықтималдықты анықтаңыз — Sunkar Finance</title>
  <link rel="icon" href="img/logo-preview.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/calc.css" />
</head>
<body>
  <header class="site-header small">
    <div class="container header-inner">
      <a href="kz.html" class="brand small">
        <img src="img/logo.png" alt="Sunkar Finance" class="logo" />
        <div class="brand-text"><div class="brand-name">Sunkar Finance</div></div>
      </a>
      <nav class="top-actions">
        <a href="kz.html">Басты бет</a>
        <a href="agents-kz.html">Агенттер</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Ықтималдықты анықтаңыз</h1>
    <p>Өтінімді толтырыңыз — біз мақұлдау ықтималдығын және кеңестерді көрсетеміз.</p>

    <form id="prob-form-kz" class="calc-form">
      <label>Аты-жөні *</label>
      <input type="text" id="name" placeholder="Иванов Иван" required />

      <label>Телефон *</label>
      <input type="tel" id="phone" placeholder="+7 7хх ххх хх хх" required />

      <label>Қала *</label>
      <input type="text" id="city" value="Астана" required />

      <label>Қызмет *</label>
      <select id="service">
        <option value="">Таңдаңыз</option>
        <option value="consumer">Тұтынушылық</option>
        <option value="mortgage">Ипотека</option>
        <option value="refinance">Қайта қаржыландыру</option>
        <option value="business">ШОБ / ЖШС</option>
        <option value="auto">Авто</option>
      </select>

      <label>Қалаған сома (₸)</label>
      <input type="number" id="amount" value="5000000" min="0" />

      <label>Айлық ресми табыс (₸)</label>
      <input type="number" id="income" value="200000" min="0" />

      <label>Ағымдағы ай сайынғы төлемдер (₸)</label>
      <input type="number" id="currentPayments" value="0" min="0" />

      <label>Қарыз бойынша кешіктірілген төлемдер бар ма?</label>
      <select id="delays">
        <option value="no">Жоқ</option>
        <option value="small">90 күнге дейін</option>
        <option value="large">90 күннен артық</option>
      </select>

      <label>Кепіл бар ма?</label>
      <select id="collateral">
        <option value="no">Жоқ</option>
        <option value="realty">Тұрғын үй</option>
        <option value="auto">Авто</option>
      </select>

      <div id="mortgage-extra" class="hidden">
        <label>Ипотека — жаңа немесе екінші нарық?</label>
        <select id="mortgage-type">
          <option value="primary">Жаңа</option>
          <option value="secondary">Екінші нарық</option>
        </select>

        <label>Алғашқы жарна (%)</label>
        <input type="number" id="downpayment" value="20" min="0" max="100" />
      </div>

      <button type="submit" class="btn btn-gold">Ықтималдығын есептеу</button>
    </form>

    <div id="prob-result" class="result hidden">
      <h3>Нәтиже</h3>
      <div id="score">—</div>
      <div id="advice"></div>
    </div>
  </main>

  <script src="js/script.js"></script>
  <script src="js/probability.js"></script>
</body>
</html>
