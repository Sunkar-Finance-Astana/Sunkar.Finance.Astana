<!-- agent.html -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Стать агентом — Sunkar Finance</title>
<meta property="og:image" content="img/logo.png">
<style>
:root{--bg:#041018;--gold:#D4A24A;--muted:rgba(255,255,255,0.78);--card-radius:12px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,#031017,#041018);color:#fff}
.container{max-width:820px;margin:18px auto;padding:16px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.logo-wrap{width:56px;height:56px;border-radius:12px;background:#081d26;display:flex;align-items:center;justify-content:center}
.logo-wrap img{width:70%}
h1{color:var(--gold)}
.card{background:linear-gradient(180deg,rgba(255,255,255,0.01),transparent);padding:14px;border-radius:var(--card-radius);border:1px solid rgba(255,255,255,0.03)}
label{display:block;margin-top:12px;color:var(--muted)}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:#fff}
.btn{margin-top:12px;padding:10px 14px;border-radius:10px;background:linear-gradient(90deg,var(--gold),#c38f3a);color:#07121B;font-weight:700;border:0;cursor:pointer}
.note{color:var(--muted);font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo-wrap"><img src="img/logo.png" alt="logo"></div>
    <div>
      <h1>Стать агентом</h1>
      <div style="color:var(--muted)">Присоединяйтесь к партнёрской сети Sunkar Finance</div>
    </div>
  </div>

  <div class="card">
    <form id="agentForm">
      <label>ФИО *</label><input id="fio" required type="text" placeholder="Иванов Иван">
      <label>Город *</label><input id="city" required type="text" placeholder="Астана">
      <label>Номер телефона *</label><input id="phone" required type="tel" placeholder="+7 7xx xxx xx xx">
      <label>Комментарий (необязательно)</label><textarea id="comment" rows="3" placeholder="Коротко о себе"></textarea>
      <button class="btn" type="button" onclick="submitAgent()">Отправить заявку в WhatsApp</button>
      <div class="note">После отправки заявки мы свяжемся с вами для подтверждения и дальнейших инструкций.</div>
    </form>
  </div>

  <footer style="margin-top:16px;color:var(--muted);font-size:13px">
    © Sunkar Finance — Астана, ул. Абая 18 — WhatsApp: <a href="https://wa.me/77052606667" style="color:var(--muted)">+7 705 260 6667</a>
  </footer>
</div>

<script>
function submitAgent(){
  const fio = encodeURIComponent(document.getElementById('fio').value||'Клиент');
  const city = encodeURIComponent(document.getElementById('city').value||'');
  const phone = encodeURIComponent(document.getElementById('phone').value||'');
  const comment = encodeURIComponent(document.getElementById('comment').value||'');
  if(!document.getElementById('fio').value || !document.getElementById('city').value || !document.getElementById('phone').value){
    alert('Заполните все обязательные поля');
    return;
  }
  const text = `Заявка%20агента%20Sunkar%20Finance%0A%0AФИО:%20${fio}%0AГород:%20${city}%0AТелефон:%20${phone}%0AКомментарий:%20${comment}`;
  const link = `https://wa.me/77052606667?text=${text}`;
  window.location.href = link;
}
</script>
</body>
</html>
